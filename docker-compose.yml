version: '3.9'

services:
  nova:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    image: nova-ai-tutor:latest
    container_name: nova_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Together AI
      TOGETHER_API_KEY: ${TOGETHER_API_KEY}
      # Search
      SERPER_API_KEY: ${SERPER_API_KEY}
      # Helicone
      HELICONE_API_KEY: ${HELICONE_API_KEY}
      # Supabase
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # Upstash Redis (rate limiting)
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN}
      # App URL
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      # OpenAI (embeddings / RAG)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Google Calendar OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      # LTI
      LTI_KEY_ID: ${LTI_KEY_ID}
      LTI_PRIVATE_KEY: ${LTI_PRIVATE_KEY}
      LTI_PUBLIC_KEY: ${LTI_PUBLIC_KEY}
    networks:
      - nova_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Nginx reverse proxy for SSL termination and caching
  nginx:
    image: nginx:1.25-alpine
    container_name: nova_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      nova:
        condition: service_healthy
    networks:
      - nova_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  nova_network:
    driver: bridge

volumes:
  nginx_cache:
